# Full-data training run: 2 epochs on the ATLAS train split, 4-GPU DDP.
#
#   bash scripts/pretrain.sh --config configs/trainer_full.yaml --gpus 4 \
#       --resume <path/to/protein_far-epoch=01-....ckpt>
#
# Continues from the small-set overfit checkpoint via `--resume_ckpt`. That path
# loads WEIGHTS ONLY and starts a fresh optimizer / LR schedule (see
# `trainer_far.py` `load_weights_only=True`), which is what we want: the overfit
# run proved the gradient path is healthy, and this run trains for real.
#
# Sizing: 15144 train windows / 4 ranks = 3786 steps/rank/epoch, i.e. ~10x the
# old (411-structure) split. Step time varies with protein size (~40-60 s/step
# measured at batch_size 1), so expect on the order of a day per epoch at 2
# epochs -- measure the real rate from the first steps rather than trusting this
# estimate.
#
# Memory: the rebuilt train split is 638 GB across 60 shards (plus a
# `train_normalized/` sibling of the same size). The shard layout is what keeps
# this loadable at all -- the loader reads `<dir>/manifest.json` and loads only
# the shards a given rank/worker owns. `num_workers * num_gpus` need not equal
# the shard count: when the grids do not tile, the loader falls back to
# whole-list iteration with intra-epoch skipping (correct, just more RAM).
train_path: "./dataset/fft_window2500_v2/train_normalized"
val_path: "./dataset/fft_window2500_v2/val_normalized"
bihito_repr_dir: null
batch_size: 1
# 60 train shards and 4 GPUs: num_workers * devices == 60 makes the grid tile
# the shard list exactly (15 shards per rank, loaded concurrently), so each rank
# reads only its own ~105 GB instead of the whole 595 GB. When the grid does not
# tile, the loader falls back to loading every shard per rank -- correct but ~6x
# the memory and slower. Change the two together.
num_workers: 15

# Model (matches paper Sec. 4.2)
spectrum_token_dim: 1
num_xyz_channels: 3
use_complex_spectrum: true
aatype_vocab_size: 21
esm_dim: 1280
with_irfc: true
num_sampling_steps: '50'
diffusion_batch_mul: 1
dropout_rate: 0.0
# MUST be < seq_len (= F = fft_window/2+1 = 1251) or it never triggers.
# `ResidueDiTBlock.forward` chunks along the FREQUENCY axis only when
# `seq_len > seq_chunk_size`; the old 2560 > 1251 meant the memory-saving path
# never ran. That was harmless while proteins were <=252 residues (adaLN output
# ~3.9 GB) but the rebuilt dataset contains up to 1000-residue chains, where one
# adaLN output alone is ~15.4 GB and 3 blocks OOM a 79 GB card.
#
# Chunking is mathematically identical, not an approximation: the block's
# attention runs along the RESIDUE axis with the frequency axis as batch, so
# splitting frequency just splits the batch.
denoise_seq_chunk_size: 256
denoise_block_type: "residue"
# Gradient checkpointing is required: the smoke run peaked at 80.7/80 GB VRAM.
denoise_use_checkpoint: true
use_checkpoint: true
max_spectrum_len: 2560

# Diffusion
learn_sigma: false
predict_xstart: true   # START_X: network regresses x_0 directly (paper Eq. diff-loss)
sigma_small: false
noise_schedule: 'cosine'
use_kl: false
rescale_learned_sigmas: false
diffusion_steps: 1000

# Training -- 2 epochs, per the user's call that 2 is enough.
max_epochs: 2
lr: 0.0001
warmup_epochs: 1
min_lr: 0.000001
warmup_start_lr: 0.0000001
plateau_patience: 8
plateau_factor: 0.7
beta: 0.000001

# Trainer -- 4-GPU DDP.
devices: 4
sync_batchnorm: true
precision: 'bf16'
gradient_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 1
reload_dataloaders_every_n_epochs: 0
num_sanity_val_steps: 0
check_val_every_n_epoch: 1
limit_val_batches: 1.0
limit_train_batches: 1.0
find_unused_parameters: true

# Checkpoints. Each ckpt is ~6.4 GB, so save every 32 steps rather than every
# step (2 epochs x 375 steps/rank / 32 ~= 24 writes per rank).
save_top_k: 1
monitor_metric: 'train_loss'
monitor_mode: 'min'
checkpoint_interval: 1
save_every_n_steps: 32

use_wandb: false
wandb_project: "BioMacroDynamicsFAR"

use_dataset_subsample: false
subsample_ratio: 0.1

use_self_forcing: false
enable_spectrum_chunk_loss: true
