# Overfit-a-small-set run: does the gradient path actually learn?
#
# This is Plan B from the training-recovery discussion. It answers one question:
# with the D34 (diffusion-head init) and D35 (degenerate-SVD NaN) fixes in place,
# does the loss actually go DOWN on a set small enough to iterate on?
#
#   bash scripts/pretrain.sh --config configs/trainer_overfit.yaml
#
# It is NOT a real training run and will NOT produce a usable model. The point is
# to separate "the gradient path is healthy" from "the full recipe converges",
# which a 1500-window / 50-epoch run (~112 days at the measured ~130 s/step on
# one H100) cannot answer in any reasonable time.
#
# Sized deliberately:
#   * 88 windows in the test split, cycled 4x per epoch = 352 optimizer steps.
#   * At the measured ~130 s/step that is ~12.7 h/epoch, ~25 h for 2 epochs.
#   * `max_epochs: 2` matters: this scheduler only leaves the warmup ramp at
#     epoch `warmup_epochs`, so warmup_epochs=1 (with 4x cycles per epoch) gives
#     two points on the LR ramp instead of one.
#   * val aliases the test split so there is no extra 29 GB load; its loss is
#     NOT a held-out estimate (it is memorised data).

run_name: "BioDynaSpec_overfit"
base_dir: "./runs"
seed: 42
deterministic: false

# Data -- deliberately the SMALL test split, for iteration speed.
train_path: "./dataset/fft_window2500/atlas_10_features_fouriered_list_test_normalized.pth"
val_path: "./dataset/fft_window2500/atlas_10_features_fouriered_list_test_normalized.pth"
bihito_repr_dir: null
batch_size: 1
# 0 keeps a single resident copy of the split. With workers each process holds
# its own copy (~2.4 GB per copy at test-split size), and the split is loaded
# eagerly either way -- see AUDIT D31.
num_workers: 0
# Cycle the 88-window split 4x per epoch, so `max_epochs: 2` gives two points on
# the LR schedule rather than one.
reload_dataloaders_every_n_epochs: 1

# Model (matches paper Sec. 4.2)
spectrum_token_dim: 1
num_xyz_channels: 3
use_complex_spectrum: true
aatype_vocab_size: 21
esm_dim: 1280
with_irfc: true
num_sampling_steps: '50'
diffusion_batch_mul: 1
dropout_rate: 0.0
denoise_seq_chunk_size: 2560
denoise_block_type: "residue"
# Gradient checkpointing is required, not optional: the smoke run peaked at
# 80.7/80 GB VRAM. Turning it off OOMs.
denoise_use_checkpoint: true
use_checkpoint: true
max_spectrum_len: 2560

# Diffusion
learn_sigma: false
predict_xstart: true   # START_X: network regresses x_0 directly (paper Eq. diff-loss)
sigma_small: false
noise_schedule: 'cosine'
use_kl: false
rescale_learned_sigmas: false
diffusion_steps: 1000

# Training. The LR schedule only leaves its warmup ramp at epoch `warmup_epochs`,
# so a 1-epoch run would sit at the ramp start the whole time and show almost no
# movement. warmup_epochs=1 + max_epochs=2 gives two schedule points.
max_epochs: 2
lr: 0.0001
warmup_epochs: 1
min_lr: 0.000001
warmup_start_lr: 0.0000001
plateau_patience: 8
plateau_factor: 0.7
beta: 0.000001

# Trainer
devices: 1
sync_batchnorm: true
precision: 'bf16'
gradient_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 1
num_sanity_val_steps: 0
check_val_every_n_epoch: 1
limit_val_batches: 1.0
limit_train_batches: 1.0     # 4 cycles x 88 windows = 352 steps/epoch
find_unused_parameters: true

# Checkpoints -- keep per-step so the loss trajectory survives the run
save_top_k: 1
monitor_metric: 'train_loss'
monitor_mode: 'min'
checkpoint_interval: 1
save_every_n_steps: 1

use_wandb: false
wandb_project: "BioMacroDynamicsFAR"

use_dataset_subsample: false
subsample_ratio: 0.1

use_self_forcing: false
enable_spectrum_chunk_loss: true
